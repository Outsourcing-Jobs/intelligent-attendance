services:
  # =========================================================================
  # 1. AI SERVICE (FastAPI Python - Dự báo rủi ro chuyên cần & Cảnh báo sớm)
  # =========================================================================
  intelligent-attendance-ai:
    build:
      context: ./intelligent-attendance-ai
      dockerfile: Dockerfile
    container_name: intelligent-attendance-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./intelligent-attendance-ai/.env.prod
    environment:
      - PORT=8000
      - AI_SERVICE_PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - attendance-net

  # =========================================================================
  # 2. BACKEND API (NestJS + MongoDB + Firebase Admin SDK + Cloudinary)
  # =========================================================================
  intelligent-attendance-api:
    build:
      context: ./intelligent-attendance-system
      dockerfile: Dockerfile
    container_name: intelligent-attendance-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./intelligent-attendance-system/.env.prod
    environment:
      - PORT=3000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://intelligent-attendance-ai:8000
      - FRONTEND_RESET_PASSWORD_URL=http://localhost:4000/auth/reset-password
    depends_on:
      intelligent-attendance-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - attendance-net

  # =========================================================================
  # 3. FRONTEND WEB APP (Next.js 16 Standalone + Tailwind CSS + Lucide Icons)
  # =========================================================================
  intelligent-attendance-web:
    build:
      context: ./intelligent-attendance-web-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
        NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDDP5DQcDLpIlJbnODUxVCssWhUhVeI6Uw
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: mygallery-2026-v1.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: mygallery-2026-v1
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: mygallery-2026-v1.appspot.com
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "655607565393"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:655607565393:web:b1ce19ff067dd99831fc70"
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: BEN8QjxpsC96vP7-iCDggVRVfzyQhHvKnzO4EeM1BZgubuEyLnl6_ztEgwEw6AP6RPWgm2mCwMzLWlGdKMEWBSA
    container_name: intelligent-attendance-web
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./intelligent-attendance-web-app/.env.prod
    environment:
      - PORT=4000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
    depends_on:
      intelligent-attendance-api:
        condition: service_healthy
    networks:
      - attendance-net

# =========================================================================
# Networks
# =========================================================================
networks:
  attendance-net:
    name: attendance-net
    driver: bridge
